name: Supabase Backup to R2

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: supabase-db-backups

    steps:
      - name: Install PostgreSQL 17 Client
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y postgresql-common

          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Verify PostgreSQL Client
        run: |
          which pg_dump
          pg_dump --version
          ls -la /usr/lib/postgresql/17/bin/

      - name: Verify AWS CLI
        run: |
          aws --version

      - name: Create Database Backup
        run: |
          set -e

          mkdir -p backups

          BACKUP_FILE="supabase-$(date +'%Y-%m-%d_%H-%M-%S').dump"

          /usr/lib/postgresql/17/bin/pg_dump \
            "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --verbose \
            > "backups/$BACKUP_FILE"

          gzip "backups/$BACKUP_FILE"

          echo "BACKUP_FILE=${BACKUP_FILE}.gz" >> $GITHUB_ENV

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region auto

      - name: Upload Backup to Cloudflare R2
        run: |
          aws s3 cp \
            "backups/$BACKUP_FILE" \
            "s3://$R2_BUCKET_NAME/$BACKUP_FILE" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Verify Upload
        run: |
          aws s3 ls \
            "s3://$R2_BUCKET_NAME/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
